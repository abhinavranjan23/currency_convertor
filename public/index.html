<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fast and accurate currency converter with real-time exchange rates" />
    <meta name="theme-color" content="#deb887" />
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://latest.currency-api.pages.dev" />
    <link rel="preconnect" href="https://flagsapi.com" />
    <link rel="dns-prefetch" href="https://latest.currency-api.pages.dev" />
    <link rel="dns-prefetch" href="https://flagsapi.com" />
    
    <title>Currency Converter - Fast & Accurate Exchange Rates</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/App.js"></script>
    <script type="module">
      // Register service worker for caching
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(new URL('../src/sw.js', import.meta.url))
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
